<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#1c0910">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.svg' | relative_url }}" width="32" height="32" alt="">
        Cellar
      </a>
      <nav aria-label="Menu">
        <a href="{{ '/' | relative_url }}#jak-dziala">Jak działa</a>
        <a href="{{ '/regulamin' | relative_url }}"{% if page.url == '/regulamin.html' %} aria-current="page"{% endif %}>Regulamin</a>
        <a href="{{ '/prywatnosc' | relative_url }}"{% if page.url == '/prywatnosc.html' %} aria-current="page"{% endif %}>Prywatność</a>
      </nav>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>© 2026 Jan Dąbrowski · Alkohol szkodzi zdrowiu – aplikacja dla osób pełnoletnich.</span>
      <nav aria-label="Dokumenty">
        <a href="{{ '/regulamin' | relative_url }}">Regulamin</a>
        <a href="{{ '/prywatnosc' | relative_url }}">Polityka prywatności</a>
        <a href="mailto:jandabrowski77@gmail.com">Kontakt</a>
      </nav>
    </div>
  </footer>
</body>
</html>
